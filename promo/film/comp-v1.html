<!DOCTYPE html>
<!-- CAHON promo, made with onetake (github.com/feitangyuan/onetake, PolyForm Noncommercial 1.0.0; motion.js is its
     library, copied beside this file). CONCEPT: one search box, one take. The box is the spine: a grey system search
     lost in a heap of files finds nothing; it becomes CAHON's box in place; each word typed opens straight into what
     it found; the camera never cuts; at the end only the box is left and its caret writes the name. -->
<html lang="th">
<head>
<meta charset="utf-8">
<title>CAHON · one take</title>
<style>
@font-face{font-family:GS;src:url(../public/google-sans-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GS;src:url(../public/google-sans-latin-ext.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GS;src:url(../public/google-sans-thai.woff2) format('woff2');font-weight:100 900}
:root{--paper:#f3f1ec;--ink:#262626;--grey:#8a8a85;--mint:#9fe5c7;--green:#1f7a55;--red:#d64545;--card:#fff;--line:#e6e4de}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{font-family:GS,sans-serif;color:var(--ink)}
#ground{position:absolute;inset:0}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.abs{position:absolute;left:0;top:0;will-change:transform,opacity}
/* the app: the real recording, a window on the desk */
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 60px 140px -40px rgba(40,35,20,.35),0 0 0 1px rgba(0,0,0,.06);transform-origin:0 0}
#app img{width:1920px;height:1080px;display:block}
/* cold open: the heap and the system search */
.chip{position:absolute;padding:12px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px;color:#7a7a75;
  white-space:nowrap;box-shadow:0 10px 24px -14px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center}
.chip svg{width:20px;height:20px}
#sys{position:absolute;border-radius:14px;background:#e9e8e4;border:1px solid #d6d4cd;display:flex;align-items:center;gap:14px;
  padding:0 22px;box-sizing:border-box;font-size:30px;color:#3b3b38;overflow:hidden}
#sys .spin{width:26px;height:26px;border-radius:50%;border:3.5px solid #cfcdc6;border-top-color:#8a8a85;flex:none}
#sys .q{flex:1;white-space:nowrap}
#sys .q i{display:inline-block;width:2.5px;height:32px;background:#3b3b38;vertical-align:-6px;margin-left:2px}
#none{position:absolute;font-size:30px;font-weight:600;color:var(--red);white-space:nowrap}
/* the end: the box alone */
#box{position:absolute;border-radius:22px;background:#fff;border:2px solid #e2e0da;box-sizing:border-box;display:flex;align-items:center;
  box-shadow:0 30px 70px -30px rgba(40,35,20,.35);overflow:hidden}
#box .lens{flex:none}
#box .w{font-weight:600;color:var(--ink);white-space:nowrap;letter-spacing:.04em}
#box .w span{display:inline-block;transform-origin:50% 90%}
#box .cur{display:inline-block;background:var(--ink);vertical-align:middle}
#mascot{position:absolute;left:0;top:0;width:200px;height:200px;transform-origin:50% 100%}
#tag{position:absolute;left:0;right:0;text-align:center;font-size:52px;color:var(--ink);white-space:nowrap}
#tag b{color:var(--green);font-weight:600}
#get{position:absolute;left:0;right:0;text-align:center;font-size:28px;color:var(--grey);white-space:nowrap}
/* screen space: captions and hits */
#cap{position:absolute;left:0;right:0;bottom:66px;display:flex;justify-content:center;gap:22px;pointer-events:none}
#cap .w{padding:14px 30px;border-radius:999px;background:rgba(255,255,255,.94);box-shadow:0 18px 40px -18px rgba(0,0,0,.35);
  font-size:46px;font-weight:600;white-space:nowrap;will-change:transform,opacity}
#cap .w.pain{color:var(--red)}
#cap .w.fix{color:var(--green)}
#stac{position:absolute;left:50%;top:0;font-size:84px;font-weight:700;color:var(--ink);white-space:nowrap;padding:6px 34px;border-radius:28px;transform-origin:50% 50%}
#stac.on{background:rgba(255,255,255,.92);box-shadow:0 20px 50px -24px rgba(0,0,0,.4)}
#hud{position:absolute;right:14px;bottom:10px;font:13px monospace;color:#c00;display:none}
</style>
</head>
<body>
<canvas id="ground" width="1920" height="1080"></canvas>
<div id="world">
  <div id="desk"></div>
  <div id="app"><img id="frame" alt=""></div>
  <div id="sys"><div class="spin" id="spin"></div><div class="q"><span id="sysq"></span><i id="syscaret"></i></div></div>
  <div id="none">ไม่พบรายการ</div>
  <div id="box"><svg class="lens" id="lens" viewBox="0 0 24 24" fill="none" stroke="#8a8a85" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><div class="w" id="word"></div></div>
  <div id="tag">ค้นหาทุกอย่าง <b>ในช่องเดียว</b></div>
  <div id="get">Windows · Mac &nbsp;·&nbsp; github.com/narathorn09/cahon</div>
  <div id="mascot"></div>
</div>
<div id="cap"></div>
<div id="stac"></div>
<div id="hud"></div>
<script src="motion.js"></script>
<script>
// Every value below is a pure function of t (seconds). Contract: __seek(t) → Promise, __ready, __meta, __track, __motion.
const {clamp, lerp, sstep, ssstep, seg, ease, spring} = OM;
const FPS = 30, DUR = 31.6, S = 0.75;                       // S: recording px (2560×1440) → world px (1920×1080)
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080, inFrame: { box: [29.2, DUR, 'whole'] } };
const $ = id => document.getElementById(id);

// ───────────────────────── the take: film time → recording time (speed ramps, never a cut) ─────────────────────────
// Knots [film, recording]; recording marks are in src/timeline.json.
const FOOT = [[0,1.0],[3.1,1.0],[3.6,1.7],[4.3,3.35],[5.4,4.55],[6.0,5.3],[6.6,6.2],[7.2,7.3],[7.4,8.0],[8.0,8.85],
  [8.8,9.75],[9.3,10.45],[10.4,11.5],[10.7,12.1],[11.4,13.0],[12.1,14.0],[12.7,15.2],[13.2,15.9],[13.5,16.4],[14.9,18.9],
  [15.6,19.6],[16.7,20.9],[17.0,22.0],[17.9,23.6],[18.3,24.3],[18.8,25.3],[19.4,26.4],[20.0,27.5],[20.8,28.3],[21.3,28.6],
  [22.0,31.0],[22.8,32.4],[23.5,33.4],[24.3,34.9],[25.8,37.2],[26.5,38.7],[27.6,40.2]];
function footAt(t) {
  if (t <= FOOT[0][0]) return FOOT[0][1];
  for (let i = 0; i < FOOT.length - 1; i++) { const [a, fa] = FOOT[i], [b, fb] = FOOT[i + 1]; if (t <= b) return lerp(fa, fb, (t - a) / (b - a)); }
  return FOOT[FOOT.length - 1][1];
}
const NFR = 1236;

// ───────────────────────── where things are (world px, from the recording's DOM) ─────────────────────────
const R = (x, y, w, h) => ({ x: x * S, y: y * S, w: w * S, h: h * S });
const BOX = R(543, 126, 1447, 87);                 // CAHON's search box
const PANEL_MASCOT = { x: 543 * S + 34, y: 330 * S + 30 };   // the mascot in the folder panel
const END_BOX = { x: 960 - 560, y: 470, w: 1120, h: 132 };    // the box alone, at the end

// ───────────────────────── beats (seconds) ─────────────────────────
const TYPE0 = 0.35, CPS = 11, SPIN0 = 1.05, NONE = 1.85;              // the system search tries, and fails
const HITS = [[2.0, 'ชื่อไฟล์?'], [2.3, 'PDF สแกน?'], [2.6, 'รหัสผ่าน?']], HITS_END = 2.88;
const ENTER = 3.1;                                                      // the box becomes CAHON's; music
const APP_OUT = 27.4, BOX_SOLO = 28.0, MASCOT_HOP = [27.9, 28.6], WRITE = 29.0, TAG = 30.0, GET = 30.35;
const CAPS = [ // [t0, t1, first (the pain), t-second, second (the answer)]
  [3.5, 6.1, 'พิมพ์คำเดียว', 4.9, 'เจอเลย', false],
  [7.6, 10.5, 'จำได้แค่ตัวเลข?', 9.3, 'เจอถึงข้างในไฟล์', true],
  [11.0, 16.8, 'ไฟล์สแกนค้นไม่ได้?', 15.0, 'น้องอ่านให้ด้วย OCR', true],
  [22.0, 27.0, 'เพิ่มโฟลเดอร์', 25.0, 'น้องสแกนให้เอง', false],
];
const STAC = [[18.25, 'ประเภทไฟล์'], [19.35, 'ช่วงเวลา'], [20.05, 'เจอแล้ว']];

// ───────────────────────── camera: keyed, chasing the hand ─────────────────────────
const bx = BOX.x + BOX.w / 2, by = BOX.y + BOX.h / 2;
const C = ease;
const KEYS = [
  { t: 0, x: bx, y: by + 30, zoom: 1.52 },
  { t: 1.85, x: bx, y: by + 34, zoom: 1.46, curve: C.sineInOut },
  { t: ENTER, x: bx, y: by + 34, zoom: 1.42 },
  { t: 4.05, x: 960, y: 540, zoom: 0.94, curve: C.cubicInOut },          // ENTER: pull out, the app around the box
  { t: 4.45, x: 950, y: 150, zoom: 1.55, curve: C.expoInOut },           // snap to the box as the hand clicks it
  { t: 5.5, x: 900, y: 215, zoom: 1.5, curve: C.sineInOut },
  { t: 6.25, x: 800, y: 360, zoom: 1.6, curve: C.sineInOut },            // the result
  { t: 7.15, x: 1340, y: 420, zoom: 1.3, curve: C.cubicInOut },          // the file opens on the right
  { t: 7.6, x: 1340, y: 420, zoom: 1.3 },
  { t: 8.1, x: 950, y: 150, zoom: 1.75, curve: C.expoInOut },            // whip back to the box
  { t: 9.05, x: 950, y: 150, zoom: 1.75 },
  { t: 9.55, x: 700, y: 386, zoom: 2.15, curve: C.expoInOut },           // dive onto the highlight inside the file
  { t: 10.55, x: 700, y: 386, zoom: 2.15 },                               // dead still
  { t: 11.05, x: 950, y: 150, zoom: 1.6, curve: C.expoInOut },
  { t: 12.3, x: 930, y: 250, zoom: 1.42, curve: C.sineInOut },
  { t: 13.25, x: 1515, y: 474, zoom: 1.95, curve: C.cubicInOut },        // the OCR row: the mascot at work
  { t: 14.9, x: 1515, y: 478, zoom: 2.05, curve: C.linear },
  { t: 15.9, x: 1515, y: 610, zoom: 1.5, curve: C.cubicInOut },          // the scanned text appears
  { t: 16.85, x: 1515, y: 610, zoom: 1.5 },
  { t: 17.35, x: 950, y: 150, zoom: 1.7, curve: C.expoInOut },           // burst: box → chips → dates → results
  { t: 18.25, x: 800, y: 268, zoom: 1.95, curve: C.expoInOut },
  { t: 19.35, x: 960, y: 300, zoom: 1.8, curve: C.expoInOut },
  { t: 20.25, x: 800, y: 560, zoom: 1.15, curve: C.expoInOut },
  { t: 21.3, x: 800, y: 560, zoom: 1.15 },                                // rest
  { t: 22.1, x: 800, y: 330, zoom: 1.6, curve: C.cubicInOut },           // the folder panel
  { t: 23.55, x: 960, y: 540, zoom: 1.2, curve: C.cubicInOut },          // the folder window
  { t: 24.35, x: 960, y: 540, zoom: 1.2 },
  { t: 25.0, x: 660, y: 318, zoom: 1.95, curve: C.cubicInOut },          // the mascot scans the new folder
  { t: 26.6, x: 660, y: 318, zoom: 2.0, curve: C.linear },
  { t: 27.7, x: 960, y: 560, zoom: 0.66, curve: C.cubicInOut },          // pull back: the app is a window on the desk
  { t: 28.6, x: 960, y: 560, zoom: 0.8, curve: C.sineInOut },
  { t: 29.6, x: 960, y: 560, zoom: 1.0, curve: C.cubicInOut },           // the box alone fills the frame
];
const SHAKES = [[NONE, 7, 10], [2.0, 5, 12], [2.3, 5, 12], [2.6, 5, 12], [ENTER, 4, 9], [18.25, 3, 12], [19.35, 3, 12], [29.0, 3, 10]];
const handEnv = t => sstep(3.6, 4.4, t) * (1 - sstep(26.8, 27.6, t));
const STILL = [[9.6, 10.55], [20.3, 21.3], [30.6, DUR]];              // holds: no float, the frame is dead still
function camAt(t) {
  const c = OM.camera(t, KEYS);
  const still = STILL.some(([a, b]) => t >= a && t <= b);
  const e = still ? 0 : handEnv(t) * 3.2;
  let x = c.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / c.zoom;
  let y = c.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / c.zoom;
  let rot = c.rot;
  for (const [th, amp, decay] of SHAKES) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / c.zoom; y += s.y / c.zoom; rot += s.rot; }
  return { x, y, zoom: c.zoom, rot };
}

// ───────────────────────── the mascot (the app's own drawing) ─────────────────────────
function mascotSvg(mood, t) {
  const INK = '#262626';
  const faces = {
    sad: `<ellipse cx="24" cy="35.6" rx="2.3" ry="2.6" fill="${INK}"/><ellipse cx="38" cy="35.6" rx="2.3" ry="2.6" fill="${INK}"/><path d="M20.5 31.6l5-1.6M41.5 31.6l-5-1.6" stroke="${INK}" stroke-width="1.8" stroke-linecap="round"/><path d="M28.5 42.6q2.5-2.6 5 0" stroke="${INK}" stroke-width="2" stroke-linecap="round" fill="none"/>`,
    happy: `<path d="M21.3 36.2q2.7-4 5.4 0M35.3 36.2q2.7-4 5.4 0" stroke="${INK}" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M27.3 39.6q3.7 5.4 7.4 0z" fill="${INK}"/><path d="M29.2 41.9q1.8 1.3 3.6 0" stroke="#ff8fa3" stroke-width="1.6" stroke-linecap="round" fill="none"/>`,
  };
  const sweep = Math.sin(t * 5) * 8;
  return `<svg viewBox="0 0 64 64" width="200" height="200" style="overflow:visible">
    <ellipse cx="31" cy="59" rx="15" ry="1.8" fill="#000" opacity=".08"/>
    <path d="M31 11.5q-1.2-4.6 3-5.6" stroke="#5cc39a" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    <path d="M9 37C9 21 19 11 31 11S53 21 53 37C53 50 44 56.5 31 56.5S9 50 9 37Z" fill="#9fe5c7"/>
    <path d="M15.5 29c1.6-5.6 5.4-9.4 10.5-11" stroke="#fff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity=".75"/>
    ${faces[mood] || faces.happy}
    <ellipse cx="19.5" cy="40.8" rx="2.8" ry="1.6" fill="#ff8fa3" opacity=".5"/><ellipse cx="42.5" cy="40.8" rx="2.8" ry="1.6" fill="#ff8fa3" opacity=".5"/>
    <g transform="rotate(${sweep.toFixed(2)} 52 51)"><circle cx="47.5" cy="46.5" r="6.8" fill="#fff" fill-opacity=".9" stroke="${INK}" stroke-width="3"/>
    <path d="M52.4 51.4l5.4 5.4" stroke="${INK}" stroke-width="4" stroke-linecap="round"/></g></svg>`;
}

// ───────────────────────── the heap (cold open) ─────────────────────────
const NAMES = ['final_v2.docx', 'สแกน_0012.pdf', 'รายงาน(1).xlsx', 'ใหม่ล่าสุดจริงๆ.docx', 'IMG_4471.jpg', 'สัญญา-แก้ไข3.pdf',
  'Book1.xlsx', 'ไม่มีชื่อ.txt', 'งบ_สำรอง.xlsx', 'scan002.pdf', 'copy of copy.docx', 'สรุปประชุม.pptx', 'รหัสผ่าน.txt',
  'ใบเสร็จ.png', 'draft_old.docx', 'ลูกค้า.csv', 'Wi-Fi.txt', 'เอกสารแนบ.zip'];
const FILE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#a5a39c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5"/></svg>';
const rnd = OM.rng(7);
const HEAP = NAMES.map((n, i) => {
  const a = (i / NAMES.length) * Math.PI * 2 + rnd() * 0.5, r = 220 + rnd() * 330;
  const d = document.createElement('div'); d.className = 'chip'; d.innerHTML = FILE_ICON + n; $('desk').appendChild(d);
  return { el: d, x: bx + Math.cos(a) * r * 1.5 - 120, y: by + Math.sin(a) * r * 0.62, rot: (rnd() - 0.5) * 16, ph: rnd() * 6, out: a };
});

// ───────────────────────── the word written at the end ─────────────────────────
const WORD = 'CAHON';
const letters = [...WORD].map(ch => { const s = document.createElement('span'); s.textContent = ch; $('word').appendChild(s); return s; });
const caret = document.createElement('i'); caret.className = 'cur'; $('word').appendChild(caret);

// ───────────────────────── seek ─────────────────────────
const g = $('ground').getContext('2d');
let curFrame = -1, CAM = null, TRACK = {};
const mat = M => `matrix(${M.map(v => +v.toFixed(5)).join(',')})`;
const place = (el, x, y, s = 1, op = 1, rot = 0) => { el.style.transform = `translate(${x}px,${y}px) rotate(${rot}deg) scale(${s})`; el.style.opacity = op; };

function ground(cam) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#f3f1ec'; g.fillRect(0, 0, 1920, 1080);
  const L = OM.lattice(cam, { depth: 1.3, spacing: 56, px: 1.5 });
  g.setTransform(...L.matrix); g.fillStyle = 'rgba(80,70,50,.16)';
  for (let x = L.x0; x <= L.x1; x += L.spacing) for (let y = L.y0; y <= L.y1; y += L.spacing) { g.beginPath(); g.arc(x, y, L.r, 0, 6.2832); g.fill(); }
  g.setTransform(1, 0, 0, 1, 0, 0);
  const v = g.createRadialGradient(960, 540, 300, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(60,50,30,.10)');
  g.fillStyle = v; g.fillRect(0, 0, 1920, 1080);
}

function seek(t) {
  const pending = [];
  CAM = camAt(t);
  ground(CAM);
  $('world').style.transform = mat(OM.view(CAM));

  // the app: the recording, frame by frame (the cursor in it is the hand that causes everything)
  const appIn = sstep(ENTER, ENTER + 0.55, t), appOut = 1 - sstep(APP_OUT, APP_OUT + 0.8, t);
  const fr = clamp(Math.round(footAt(t) * FPS), 0, NFR - 1);
  if (fr !== curFrame) { curFrame = fr; const img = $('frame'); img.src = `../public/frames/${String(fr + 1).padStart(4, '0')}.jpg`; pending.push(img.decode().catch(() => {})); }
  const shrink = lerp(1, 0.94, sstep(APP_OUT - 0.2, APP_OUT + 0.8, t));
  $('app').style.transform = `translate(${960 * (1 - shrink)}px,${540 * (1 - shrink) + 40 * sstep(APP_OUT, APP_OUT + 0.8, t)}px) scale(${shrink})`;
  $('app').style.opacity = appIn * appOut;

  // the heap: drifts, trembles at "not found", is blown out at ENTER
  const blow = ease.expoOut(seg(t, ENTER, ENTER + 0.9));
  HEAP.forEach((h, i) => {
    const imp = OM.ring(t - NONE, 7, 30) * 6;
    const dx = Math.sin(t * 0.8 + h.ph) * 8 + Math.cos(h.out) * 900 * blow + imp * Math.sin(h.ph * 3);
    const dy = Math.cos(t * 0.7 + h.ph) * 6 + Math.sin(h.out) * 600 * blow;
    place(h.el, h.x + dx, h.y + dy, 1, (0.55 + 0.25 * sstep(0, 1.2, t)) * (1 - blow), h.rot + 10 * blow * Math.sin(h.ph));
  });

  // the system search: types, spins, fails — then becomes CAHON's box (same place, its look changes)
  const sys = $('sys');
  const morph = ease.expoOut(seg(t, ENTER, ENTER + 0.5));
  sys.style.left = BOX.x + 'px'; sys.style.top = BOX.y + 'px'; sys.style.width = BOX.w + 'px'; sys.style.height = BOX.h + 'px';
  sys.style.transform = `scale(${1 + 0.04 * OM.impact(t, ENTER, { decay: 8 }).r})`;
  sys.style.opacity = 1 - sstep(ENTER + 0.15, ENTER + 0.55, t);
  sys.style.background = morph > 0 ? '#fff' : '#e9e8e4';
  const ty = OM.typeOn(t, TYPE0, 'สัญญาเช่า', { cps: CPS });
  $('sysq').textContent = ty.str;
  $('syscaret').style.opacity = t < SPIN0 ? 1 : 0;
  const spin = $('spin'); spin.style.transform = `rotate(${(t * 520) % 360}deg)`;
  spin.style.opacity = t > SPIN0 && t < NONE ? 1 : 0.25;
  const none = $('none'), ni = OM.wordRise(t, NONE);
  none.style.left = BOX.x + 24 + 'px'; none.style.top = BOX.y + BOX.h + 16 + 'px';
  none.style.transform = `translate(${OM.ring(t - NONE, 9, 40) * 6}px,${ni.y}px)`;
  none.style.opacity = ni.op * (1 - sstep(ENTER, ENTER + 0.3, t));

  // the hits over the pain (a burst of bare cuts)
  const st = $('stac'); const hit = HITS.filter(([h]) => t >= h && t < HITS_END).pop() || STAC.filter(([h]) => t >= h && t < h + 0.6).pop();
  st.textContent = hit ? hit[1] : '';
  st.style.top = (hit && hit[0] < ENTER ? 150 : 140) + 'px';
  st.style.color = hit && hit[0] < ENTER ? '#d64545' : '#262626';
  st.className = hit && hit[0] > ENTER ? 'on' : '';
  st.style.top = (hit && hit[0] < ENTER ? 120 : 90) + 'px';
  if (hit) { const k = OM.impact(t, hit[0], { decay: 12 }); st.style.transform = `translateX(-50%) scale(${k.sx},${k.sy})`; } else st.style.transform = 'translateX(-50%)';

  // captions: the pain asked, then answered
  const capEl = $('cap'); capEl.innerHTML = '';
  for (const [a, b, w1, t2, w2, pain] of CAPS) {
    if (t < a || t > b) continue;
    const out = 1 - sstep(b - 0.3, b, t);
    const p1 = OM.wordRise(t, a), d1 = document.createElement('div'); d1.className = 'w' + (pain ? ' pain' : ''); d1.textContent = w1;
    d1.style.opacity = p1.op * out * (t > t2 && pain ? 0.45 : 1); d1.style.transform = `translateY(${p1.y}px) scale(${p1.s})`; capEl.appendChild(d1);
    if (t >= t2) { const p2 = OM.wordRise(t, t2), d2 = document.createElement('div'); d2.className = 'w fix'; d2.textContent = w2;
      d2.style.opacity = p2.op * out; d2.style.transform = `translateY(${p2.y}px) scale(${p2.s})`; capEl.appendChild(d2); }
  }

  // the end: the box alone (it comes out of the app's box), the mascot hops onto it, the caret writes the name
  const solo = ease.cubicInOut(seg(t, BOX_SOLO - 0.6, BOX_SOLO + 0.5));
  const fromBox = { x: 960 - 0.94 * (960 - BOX.x), y: 540 + 40 - 0.94 * (540 - BOX.y), w: BOX.w * 0.94, h: BOX.h * 0.94 };
  const r = { x: lerp(fromBox.x, END_BOX.x, solo), y: lerp(fromBox.y, END_BOX.y, solo), w: lerp(fromBox.w, END_BOX.w, solo), h: lerp(fromBox.h, END_BOX.h, solo) };
  const box = $('box');
  Object.assign(box.style, { left: r.x + 'px', top: r.y + 'px', width: r.w + 'px', height: r.h + 'px', padding: `0 ${r.h * 0.32}px`, gap: r.h * 0.22 + 'px' });
  box.style.opacity = sstep(APP_OUT + 0.2, APP_OUT + 0.6, t);
  $('lens').setAttribute('width', r.h * 0.42); $('lens').setAttribute('height', r.h * 0.42);
  const fs = r.h * 0.56; $('word').style.fontSize = fs + 'px';
  letters.forEach((s, i) => { const l = OM.letterDrop(t, WRITE, i, { stagger: 0.09, dist: 40 }); s.style.opacity = l.op; s.style.transform = `translateY(${l.y}px) scale(${l.sx},${l.sy})`; });
  const typed = Math.min(WORD.length, Math.max(0, Math.floor((t - WRITE) / 0.09) + 1));
  caret.style.width = fs * 0.5 + 'px'; caret.style.height = fs * 0.82 + 'px'; caret.style.marginLeft = fs * 0.08 + 'px';
  caret.style.opacity = t < WRITE - 0.4 ? 0 : (t < WRITE + 0.5 ? 1 : (Math.floor((t - WRITE) * 2) % 2 ? 0.15 : 1));

  // the mascot: leaves the folder panel, hops onto the box, celebrates
  const m = $('mascot');
  const hop = OM.hop(t, MASCOT_HOP[0], MASCOT_HOP[1], { x: fromBox.x + 30, y: 300 }, { x: END_BOX.x + END_BOX.w - 230, y: END_BOX.y - 178 }, { height: 220 });
  const land = OM.impact(t, MASCOT_HOP[1], { decay: 7 });
  const bounce = t > WRITE + 0.6 ? Math.abs(Math.sin((t - WRITE - 0.6) * 5)) * -14 * (1 - sstep(30.4, 30.9, t)) : 0;
  place(m, hop.x, hop.y + bounce, 1, sstep(MASCOT_HOP[0] - 0.05, MASCOT_HOP[0] + 0.15, t));
  m.style.transform += ` scale(${land.sx},${land.sy})`;
  m.innerHTML = mascotSvg(t > MASCOT_HOP[1] ? 'happy' : 'happy', t);

  const tg = OM.wordRise(t, TAG), gt = OM.wordRise(t, GET);
  $('tag').style.top = END_BOX.y + END_BOX.h + 54 + 'px'; $('tag').style.opacity = tg.op; $('tag').style.transform = `translateY(${tg.y}px)`;
  $('get').style.top = END_BOX.y + END_BOX.h + 140 + 'px'; $('get').style.opacity = gt.op; $('get').style.transform = `translateY(${gt.y}px)`;

  const M = OM.view(CAM);
  TRACK = { box: OM.projectBox(M, { ...r, op: +box.style.opacity }) };
  if (HUD) $('hud').textContent = `t ${t.toFixed(2)} · foot ${footAt(t).toFixed(2)} · zoom ${CAM.zoom.toFixed(2)}`;
  return Promise.all(pending).then(() => true);
}

window.__seek = t => seek(t);
window.__track = t => { seek(t); return TRACK; };
window.__motion = (t0, t1) => OM.screenTravel(camAt(t0), camAt(t1), camAt((t0 + t1) / 2));   // footage flips are cuts, not travel
window.__events = () => [
  ...[0.35, 0.45, 0.55, 0.65, 0.75].map(t => ({ t, kind: 'key' })), { t: NONE, kind: 'thud' },
  ...HITS.map(([t]) => ({ t, kind: 'hit' })), { t: ENTER, kind: 'enter' },
  ...[4.3, 6.6, 8.0, 12.7, 13.5, 18.8, 19.4, 20.0, 22.8, 24.3].map(t => ({ t, kind: 'click' })),
  ...[8.1, 9.55, 11.05, 17.35, 18.25, 19.35, 20.25].map(t => ({ t, kind: 'whoosh' })),
  { t: 14.9, kind: 'done' }, { t: 26.5, kind: 'done' }, { t: MASCOT_HOP[1], kind: 'land' },
  ...letters.map((_, i) => ({ t: WRITE + i * 0.09, kind: 'key' })),
];
const Q = new URLSearchParams(location.search), HUD = Q.has('hud');
if (HUD) $('hud').style.display = 'block';
window.__ready = document.fonts.ready.then(() => seek(Q.has('t') ? +Q.get('t') : 0));
if (Q.has('play')) { const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(tick); }; tick(); }
</script>
</body>

<!DOCTYPE html>
<!-- CAHON promo v2, made with onetake (github.com/feitangyuan/onetake, PolyForm Noncommercial 1.0.0; motion.js is its
     library, fetched by ../prepare-assets.sh). CONCEPT: one search box, one take, told in pictures. The mascot lives the
     pain (every file it checks is wrong, a scan it can't read, a key/note/link that slip away, a search that spins), jumps
     onto the system search bar and it becomes CAHON's box; then, in the real app, every answer is shown, not written: a line
     from the word to the file, a lens on the number inside, a beam that reads the scan, file-type badges, a calendar that
     flips, a folder that flies in. A host mascot in the corner reacts to each. The camera never cuts. -->
<html lang="th">
<head>
<meta charset="utf-8">
<title>CAHON · one take, in pictures</title>
<style>
@font-face{font-family:GS;src:url(../public/google-sans-latin.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GS;src:url(../public/google-sans-latin-ext.woff2) format('woff2');font-weight:100 900}
@font-face{font-family:GS;src:url(../public/google-sans-thai.woff2) format('woff2');font-weight:100 900}
:root{--paper:#f3f1ec;--ink:#262626;--grey:#8a8a85;--mint:#3fcf8e;--green:#1f7a55;--red:#e5484d;--line:#e6e4de}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
body{font-family:GS,sans-serif;color:var(--ink)}
#ground{position:absolute;inset:0}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#app{position:absolute;left:0;top:0;width:1920px;height:1080px;border-radius:22px;overflow:hidden;background:#fff;
  box-shadow:0 60px 140px -40px rgba(40,35,20,.35),0 0 0 1px rgba(0,0,0,.06);transform-origin:0 0}
#app img{width:1920px;height:1080px;display:block}
.chip{position:absolute;left:0;top:0;padding:12px 18px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:22px;color:#7a7a75;
  white-space:nowrap;box-shadow:0 10px 24px -14px rgba(0,0,0,.25);display:flex;gap:10px;align-items:center;transform-origin:50% 50%}
.chip svg{width:20px;height:20px}
.x,.ok{position:absolute;left:0;top:0;width:64px;height:64px;border-radius:50%;display:grid;place-items:center;transform-origin:50% 50%}
.x{background:var(--red);box-shadow:0 10px 24px -10px rgba(229,72,77,.7)}
.ok{background:var(--mint);box-shadow:0 10px 24px -10px rgba(63,207,142,.8)}
.x svg,.ok svg{width:34px;height:34px}
#sys{position:absolute;border-radius:14px;background:#e9e8e4;border:1px solid #d6d4cd;display:flex;align-items:center;gap:14px;
  padding:0 22px;box-sizing:border-box;font-size:30px;color:#3b3b38;overflow:hidden;transform-origin:50% 50%}
#sys .spin{width:28px;height:28px;border-radius:50%;border:4px solid #cfcdc6;border-top-color:#6d6d68;flex:none}
#sys .q{flex:1;white-space:nowrap}
.paper{position:absolute;left:0;top:0;width:200px;height:260px;border-radius:10px;background:#fff;border:1px solid var(--line);
  box-shadow:0 24px 50px -20px rgba(0,0,0,.35);overflow:hidden;transform-origin:50% 50%}
.paper .tag{position:absolute;left:14px;top:14px;padding:3px 10px;border-radius:6px;background:#fde8e8;color:var(--red);font-size:18px;font-weight:700}
.paper svg.lines{position:absolute;left:18px;top:56px;width:164px;height:180px}
.paper .beam{position:absolute;left:0;right:0;height:26px;background:linear-gradient(to bottom,rgba(63,207,142,0),rgba(63,207,142,.55),rgba(63,207,142,0));
  border-bottom:3px solid var(--mint)}
.token{position:absolute;left:0;top:0;width:96px;height:96px;border-radius:26px;display:grid;place-items:center;box-shadow:0 18px 36px -18px rgba(0,0,0,.4);transform-origin:50% 50%}
.token svg{width:50px;height:50px}
.mascot{position:absolute;left:0;top:0;transform-origin:50% 100%}
#lens{position:absolute;left:0;top:0;width:190px;height:190px;border-radius:50%;overflow:hidden;border:9px solid var(--ink);box-sizing:border-box;
  background:#fff;box-shadow:0 20px 40px -14px rgba(0,0,0,.45);transform-origin:50% 50%}
#lens img{position:absolute;left:0;top:0;transform-origin:0 0;max-width:none}
#lensHandle{position:absolute;left:0;top:0;width:90px;height:22px;border-radius:11px;background:var(--ink);transform-origin:0 50%}
.badge{position:absolute;left:0;top:0;width:96px;height:112px;border-radius:18px;background:#fff;border:1px solid var(--line);box-shadow:0 18px 36px -16px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transform-origin:50% 100%}
.badge b{font-size:22px;color:#fff;padding:4px 10px;border-radius:7px;font-weight:700;letter-spacing:.04em}
.badge svg{width:40px;height:40px}
#cal{position:absolute;left:0;top:0;width:120px;height:128px;border-radius:20px;background:#fff;border:1px solid var(--line);overflow:hidden;
  box-shadow:0 18px 36px -16px rgba(0,0,0,.35);transform-origin:50% 100%}
#cal .top{height:34px;background:var(--red)}
#cal .num{position:absolute;left:0;right:0;top:40px;text-align:center;font-size:58px;font-weight:700;color:var(--ink);transform-origin:50% 0}
#folder{position:absolute;left:0;top:0;width:120px;height:96px;transform-origin:50% 100%}
#over{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:visible;pointer-events:none}
#box{position:absolute;border-radius:22px;background:#fff;border:2px solid #e2e0da;box-sizing:border-box;display:flex;align-items:center;
  box-shadow:0 30px 70px -30px rgba(40,35,20,.35);overflow:hidden}
#box .w{font-weight:600;color:var(--ink);white-space:nowrap;letter-spacing:.04em}
#box .w span{display:inline-block;transform-origin:50% 90%}
#box .cur{display:inline-block;background:var(--ink);vertical-align:middle}
#tag{position:absolute;left:0;right:0;text-align:center;font-size:52px;color:var(--ink);white-space:nowrap}
#tag b{color:var(--green);font-weight:600}
#get{position:absolute;left:0;right:0;text-align:center;font-size:28px;color:var(--grey);white-space:nowrap}
#host{position:absolute;left:40px;top:830px;width:210px;height:210px}
</style>
</head>
<body>
<canvas id="ground" width="1920" height="1080"></canvas>
<div id="world">
  <div id="desk"></div>
  <div class="paper" id="scanCard"><div class="tag">PDF</div><svg class="lines" id="squig" viewBox="0 0 164 180"></svg></div>
  <div id="tokens"></div>
  <div id="sys"><div class="spin" id="spin"></div><div class="q"><span id="sysq"></span></div></div>
  <div id="app"><img id="frame" alt=""></div>
  <svg id="over" viewBox="0 0 1920 1080"></svg>
  <div class="paper" id="ocrCard"><div class="tag">PDF</div><svg class="lines" id="squig2" viewBox="0 0 164 180"></svg><div class="beam" id="beam"></div></div>
  <div id="lens"><img id="lensImg" alt=""></div><div id="lensHandle"></div>
  <div id="badges"></div>
  <div id="cal"><div class="top"></div><div class="num" id="calNum">1</div></div>
  <svg id="folder" viewBox="0 0 120 96"><path d="M6 18a10 10 0 0 1 10-10h30l10 12h48a10 10 0 0 1 10 10v50a10 10 0 0 1-10 10H16A10 10 0 0 1 6 80z" fill="#f6c453" stroke="#262626" stroke-width="4" stroke-linejoin="round"/><path d="M6 34h108" stroke="#262626" stroke-width="4"/></svg>
  <div id="box"><svg id="lensIcon" viewBox="0 0 24 24" fill="none" stroke="#8a8a85" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><div class="w" id="word"></div></div>
  <div id="tag">ค้นหาทุกอย่าง <b>ในช่องเดียว</b></div>
  <div id="get">Windows · Mac &nbsp;·&nbsp; github.com/narathorn09/cahon</div>
  <div class="mascot" id="star"></div>
</div>
<div class="mascot" id="host"></div>
<div class="ok" id="hostOk"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></div>
<div id="hud" style="position:absolute;right:14px;bottom:10px;font:13px monospace;color:#c00;display:none"></div>
<script src="motion.js"></script>
<script src="timeline.js"></script>
<script>
// Every value is a pure function of t. Contract: __seek(t) → Promise, __ready, __meta, __track, __motion, __events.
const {clamp, lerp, sstep, seg, ease} = OM;
const cubicIn = u => u * u * u;
const $ = id => document.getElementById(id);
const FPS = 30, S = 0.75;                                       // recording px (2560×1440) → world px
const M = Object.fromEntries(TL.marks.map(m => [m.name, m]));
const tR = n => M[n].t;                                         // recording time of a mark
const wR = n => { const r = M[n].rect; return { x: r.x * S, y: r.y * S, w: r.w * S, h: r.h * S }; };
const ctr = r => ({ x: r.x + r.w / 2, y: r.y + r.h / 2 });

// ───────── the take: [recording from, recording to, film seconds, name] — speed ramps and holds, never a cut ─────────
const COLD = 6.6;
const SEGS = [
  [1.0, 1.0, COLD, 'cold'], [1.0, 1.0, 1.3, 'enter'],
  [1.0, tR('box'), 1.1, 's1'], [tR('box'), tR('typed1'), 2.1, 'type1'], [tR('typed1'), tR('row1'), 0.5, 'found1'],
  [tR('row1'), tR('row1') + 0.5, 1.8, 'pay1'], [tR('row1') + 0.5, tR('detail1'), 1.3, 'open1'], [tR('detail1'), tR('detail1') + 0.6, 1.0, 'hold1'],
  [tR('detail1') + 0.6, tR('box2'), 0.5, 's2'], [tR('box2'), tR('hl2'), 2.2, 'type2'], [tR('hl2'), tR('hl2') + 0.6, 2.6, 'pay2'],
  [tR('hl2') + 0.6, tR('box3'), 0.5, 's3'], [tR('box3'), tR('row3'), 2.2, 'type3'], [tR('row3'), tR('detail3'), 1.3, 'open3'],
  [tR('detail3'), tR('ocrRun'), 0.9, 'ocrClick'], [tR('ocrRun'), tR('ocrDone'), 2.4, 'reading'], [tR('ocrDone'), tR('ocrText'), 1.2, 'read'],
  [tR('ocrText'), tR('ocrText') + 0.8, 2.0, 'pay3'],
  [tR('ocrText') + 0.8, tR('box4'), 0.4, 's4'], [tR('box4'), tR('chips'), 1.9, 'type4'], [tR('chips'), tR('excelOn'), 1.7, 'excel'],
  [tR('excelOn'), tR('excelOn'), 0.5, 'hold4'], [tR('dateBtn'), tR('d30'), 1.3, 'date'], [tR('d30'), tR('narrowed'), 1.5, 'd30'],
  [tR('narrowed'), tR('narrowed') + 0.5, 1.1, 'pay4'],
  [tR('narrowed') + 0.5, tR('panel'), 1.6, 's5'], [tR('panel'), tR('picker'), 1.4, 'add'], [tR('picker'), tR('choose'), 1.7, 'pick'],
  [tR('choose'), tR('scanning'), 0.9, 'choose'], [tR('scanning'), tR('scanned'), 2.4, 'scanning'], [tR('scanned'), tR('scanned') + 0.8, 1.7, 'pay5'],
  [tR('scanned') + 0.8, tR('scanned') + 0.8, 5.6, 'end'],
];
const T = {}; const FOOT = []; { let t = 0; for (const [a, b, d, n] of SEGS) { T[n] = t; FOOT.push([t, a], [t + d - 1e-4, b]); t += d; } T.done = t; }
const DUR = +T.done.toFixed(2);
window.__meta = { dur: DUR, fps: FPS, w: 1920, h: 1080, inFrame: { box: [T.end + 1.9, DUR, 'whole'] } };
function footAt(t) {
  if (t <= FOOT[0][0]) return FOOT[0][1];
  for (let i = 0; i < FOOT.length - 1; i++) { const [a, fa] = FOOT[i], [b, fb] = FOOT[i + 1]; if (t <= b) return b > a ? lerp(fa, fb, (t - a) / (b - a)) : fb; }
  return FOOT[FOOT.length - 1][1];
}
const NFR = 1446;
function filmOf(rec) { for (let i = 0; i < FOOT.length - 1; i += 2) { const [a, fa] = FOOT[i], [b, fb] = FOOT[i + 1]; if (rec >= fa && rec <= fb && fb > fa) return lerp(a, b, (rec - fa) / (fb - fa)); } return 0; }
// when the hand presses, in film time (the recorder moves ~0.65 s before each click)
const CLICK = { box1: filmOf(tR('box') + 0.65), box2: filmOf(tR('box2') + 0.65), box3: filmOf(tR('box3') + 0.65), box4: filmOf(tR('box4') + 0.65),
  ocr: filmOf(tR('ocrRun') - 0.2), excel: filmOf(tR('excel') + 0.65), date: filmOf(tR('dateBtn') + 0.65), d30: filmOf(tR('d30') + 0.65),
  add: filmOf(tR('addBtn') + 0.65), dir: filmOf(tR('dir') + 0.65), choose: filmOf(tR('choose') + 0.65) };

// ───────── places (world px) ─────────
const BOX = wR('box'), ROW1 = wR('row1'), HL2 = wR('hl2'), OCRROW = wR('ocrRun'), OCRTXT = wR('ocrText'), CHIPS = wR('chips'), EXCEL = wR('excel'),
  DATEB = wR('dateBtn'), LIST = wR('narrowed'), DIR = wR('dir'), NEWF = wR('newFolder');
const bx = BOX.x + BOX.w / 2, by = BOX.y + BOX.h / 2;
const END_BOX = { x: 960 - 560, y: 470, w: 1120, h: 132 };

// ───────── camera ─────────
const C = ease;
const KEYS = [
  { t: 0, x: 960, y: 470, zoom: 1.12 },
  { t: 2.6, x: 960, y: 470, zoom: 1.16, curve: C.sineInOut },
  { t: 3.0, x: 960, y: 500, zoom: 1.25, curve: C.cubicInOut },                 // the scan it can't read
  { t: 4.3, x: 960, y: 500, zoom: 1.28, curve: C.linear },
  { t: 4.7, x: 960, y: 480, zoom: 1.0, curve: C.cubicInOut },                  // the things that slip away
  { t: 5.6, x: bx, y: by + 40, zoom: 1.45, curve: C.cubicInOut },              // the spinning bar
  { t: T.enter, x: bx, y: by + 40, zoom: 1.5, curve: C.linear },
  { t: T.enter + 1.0, x: 960, y: 540, zoom: 0.94, curve: C.cubicInOut },      // ENTER: the app around the box
  { t: CLICK.box1 + 0.05, x: 950, y: 170, zoom: 1.5, curve: C.expoInOut },
  { t: T.found1, x: 860, y: 230, zoom: 1.45, curve: C.sineInOut },
  { t: T.pay1 + 0.3, x: 800, y: 290, zoom: 1.5, curve: C.cubicInOut },        // word → file
  { t: T.open1, x: 800, y: 290, zoom: 1.5 },
  { t: T.hold1, x: 1300, y: 430, zoom: 1.22, curve: C.cubicInOut },
  { t: CLICK.box2, x: 950, y: 160, zoom: 1.6, curve: C.expoInOut },
  { t: T.pay2 - 0.1, x: 950, y: 200, zoom: 1.55, curve: C.sineInOut },
  { t: T.pay2 + 0.5, x: ctr(HL2).x, y: ctr(HL2).y - 30, zoom: 2.0, curve: C.cubicInOut }, // the lens on the number
  { t: T.s3, x: ctr(HL2).x, y: ctr(HL2).y - 30, zoom: 2.02, curve: C.linear },
  { t: CLICK.box3, x: 950, y: 160, zoom: 1.55, curve: C.expoInOut },
  { t: T.open3, x: 900, y: 260, zoom: 1.4, curve: C.sineInOut },
  { t: T.ocrClick + 0.2, x: 1515, y: 420, zoom: 1.55, curve: C.cubicInOut },   // the OCR row, the paper above it
  { t: T.read, x: 1515, y: 410, zoom: 1.6, curve: C.linear },
  { t: T.pay3, x: 1515, y: 600, zoom: 1.45, curve: C.cubicInOut },             // the text it read
  { t: T.s4, x: 1515, y: 600, zoom: 1.47, curve: C.linear },
  { t: CLICK.box4, x: 950, y: 170, zoom: 1.55, curve: C.expoInOut },
  { t: T.excel, x: 800, y: 210, zoom: 1.65, curve: C.cubicInOut },             // badges over the chips
  { t: T.hold4, x: 800, y: 300, zoom: 1.35, curve: C.cubicInOut },
  { t: T.date + 0.2, x: 950, y: 250, zoom: 1.6, curve: C.cubicInOut },         // the calendar
  { t: T.pay4, x: 800, y: 520, zoom: 1.1, curve: C.cubicInOut },
  { t: T.s5, x: 800, y: 520, zoom: 1.1 },
  { t: CLICK.add, x: 800, y: 320, zoom: 1.55, curve: C.cubicInOut },
  { t: T.pick + 0.2, x: 960, y: 520, zoom: 1.2, curve: C.cubicInOut },
  { t: CLICK.choose, x: 960, y: 520, zoom: 1.2 },
  { t: T.scanning + 0.3, x: 760, y: 320, zoom: 1.75, curve: C.cubicInOut },   // the folder lands, the mascot scans
  { t: T.end, x: 760, y: 320, zoom: 1.8, curve: C.linear },
  { t: T.end + 1.1, x: 960, y: 560, zoom: 0.66, curve: C.cubicInOut },
  { t: T.end + 1.9, x: 960, y: 560, zoom: 0.8, curve: C.sineInOut },
  { t: T.end + 2.9, x: 960, y: 560, zoom: 1.0, curve: C.cubicInOut },
];
const STILL = [[T.pay2 + 0.6, T.s3], [T.pay4 + 0.1, T.s5], [T.end + 3.6, 999]];
const SHAKES = [[T.enter + 0.05, 5, 9], [T.end + 2.1, 3, 10]];
function camAt(t) {
  const k = OM.camera(t, KEYS), still = STILL.some(([a, b]) => t >= a && t <= b);
  const e = still ? 0 : sstep(T.enter + 0.6, T.enter + 1.4, t) * (1 - sstep(T.end, T.end + 0.8, t)) * 3;
  let x = k.x + e * (Math.sin(1.7 * t) + 0.6 * Math.sin(2.9 * t + 1)) / k.zoom, y = k.y + e * (Math.sin(1.3 * t + 2) + 0.5 * Math.sin(3.3 * t)) / k.zoom, rot = k.rot;
  for (const [th, amp, decay] of SHAKES) { const s = OM.shake(t, th, { amp, decay, seed: Math.round(th * 100) }); x += s.x / k.zoom; y += s.y / k.zoom; rot += s.rot; }
  return { x, y, zoom: k.zoom, rot };
}

// ───────── the mascot (the app's own drawing, every mood) ─────────
function mascotSvg(mood, t, size) {
  const I = '#262626';
  const F = {
    idle: `<ellipse cx="24" cy="35" rx="2.4" ry="3.1" fill="${I}"/><ellipse cx="38" cy="35" rx="2.4" ry="3.1" fill="${I}"/><path d="M28.5 40.5q2.5 2.6 5 0" stroke="${I}" stroke-width="2" stroke-linecap="round" fill="none"/>`,
    happy: `<path d="M21.3 36.2q2.7-4 5.4 0M35.3 36.2q2.7-4 5.4 0" stroke="${I}" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M27.3 39.6q3.7 5.4 7.4 0z" fill="${I}"/><path d="M29.2 41.9q1.8 1.3 3.6 0" stroke="#ff8fa3" stroke-width="1.6" stroke-linecap="round" fill="none"/>`,
    working: `<ellipse cx="${(25.4 + Math.sin(t * 7) * 1.3).toFixed(2)}" cy="35" rx="2.4" ry="3.1" fill="${I}"/><ellipse cx="${(39.4 + Math.sin(t * 7) * 1.3).toFixed(2)}" cy="35" rx="2.4" ry="3.1" fill="${I}"/><path d="M29 41h4.4" stroke="${I}" stroke-width="2" stroke-linecap="round"/>`,
    confused: `<ellipse cx="24" cy="35" rx="2.4" ry="3.1" fill="${I}"/><circle cx="38" cy="35.4" r="1.7" fill="${I}"/><path d="M35.4 29.6l4.6-1.4" stroke="${I}" stroke-width="1.8" stroke-linecap="round"/><path d="M27.5 41.6q1.6-1.8 3.2 0t3.2 0" stroke="${I}" stroke-width="1.9" stroke-linecap="round" fill="none"/>`,
    sad: `<ellipse cx="24" cy="35.6" rx="2.3" ry="2.6" fill="${I}"/><ellipse cx="38" cy="35.6" rx="2.3" ry="2.6" fill="${I}"/><path d="M20.5 31.6l5-1.6M41.5 31.6l-5-1.6" stroke="${I}" stroke-width="1.8" stroke-linecap="round"/><path d="M28.5 42.6q2.5-2.6 5 0" stroke="${I}" stroke-width="2" stroke-linecap="round" fill="none"/>`,
    sleepy: `<path d="M21.4 35.6q2.6 1.8 5.2 0M35.4 35.6q2.6 1.8 5.2 0" stroke="${I}" stroke-width="2" stroke-linecap="round" fill="none"/><ellipse cx="31" cy="41.4" rx="1.5" ry="1.8" fill="${I}"/>`,
  };
  F.celebrate = F.happy;
  const u = (t * 1.4) % 1, z = (t * 0.6) % 1;
  const extra = {
    confused: `<text x="45" y="${(16 + Math.sin(t * 6) * 1.5).toFixed(2)}" font-size="13" font-weight="700" fill="${I}" font-family="GS">?</text>`,
    sad: `<path d="M21.5 39.2q-1.6 2.6 0 3.6q1.6-1 0-3.6z" fill="#6cb8f0" transform="translate(0 ${(u * 9).toFixed(2)})" opacity="${(1 - u).toFixed(2)}"/>`,
    sleepy: `<text x="${(46 + z * 6).toFixed(2)}" y="${(16 - z * 8).toFixed(2)}" font-size="8" font-weight="700" fill="${I}" opacity="${(1 - z).toFixed(2)}" font-family="GS">z</text>`,
    celebrate: [[8, 14, '#ffc94d', 0], [54, 8, '#ff8fa3', 1.3], [58, 28, '#6cb8f0', 2.6]].map(([x, y, col, d]) =>
      `<path transform="translate(${x} ${y}) scale(${(0.5 + 0.6 * Math.abs(Math.sin(t * 5 + d))).toFixed(2)})" d="M0 -4l1.2 2.8 2.8 1.2-2.8 1.2-1.2 2.8-1.2-2.8-2.8-1.2 2.8-1.2z" fill="${col}"/>`).join(''),

  $('lensIcon').setAttribute('width', r.h * 0.42); $('lensIcon').setAttribute('height', r.h * 0.42);
  const WRITE = T.end + 2.3, fs = r.h * 0.56; $('word').style.fontSize = fs + 'px';
  letters.forEach((s, i) => { const l = OM.letterDrop(t, WRITE, i, { stagger: 0.1, dist: 40 }); s.style.opacity = l.op; s.style.transform = `translateY(${l.y}px) scale(${l.sx},${l.sy})`; });
  caret.style.width = fs * 0.5 + 'px'; caret.style.height = fs * 0.82 + 'px'; caret.style.marginLeft = fs * 0.08 + 'px';
  caret.style.opacity = t < WRITE - 0.4 ? 0 : (t < WRITE + 0.6 ? 1 : (Math.floor((t - WRITE) * 2) % 2 ? 0.15 : 1));
  const tg = OM.wordRise(t, WRITE + 0.9), gt = OM.wordRise(t, WRITE + 1.3);
  $('tag').style.top = END_BOX.y + END_BOX.h + 54 + 'px'; $('tag').style.opacity = tg.op; $('tag').style.transform = `translateY(${tg.y}px)`;
  $('get').style.top = END_BOX.y + END_BOX.h + 140 + 'px'; $('get').style.opacity = gt.op; $('get').style.transform = `translateY(${gt.y}px)`;

  TRACK = { box: OM.projectBox(OM.view(CAM), { ...r, op: +box.style.opacity }) };
  if (HUD) $('hud').textContent = `t ${t.toFixed(2)} · rec ${footAt(t).toFixed(2)} · zoom ${CAM.zoom.toFixed(2)}`;
  return Promise.all(pending).then(() => true);
}

window.__seek = t => seek(t);
window.__track = t => { seek(t); return TRACK; };
window.__motion = (t0, t1) => OM.screenTravel(camAt(t0), camAt(t1), camAt((t0 + t1) / 2));   // footage flips are cuts, not travel
window.__events = () => ({ T, CLICK, CHECK: CHECK.map(c => c[0]), DUR });
const Q = new URLSearchParams(location.search), HUD = Q.has('hud');
if (HUD) $('hud').style.display = 'block';
window.__ready = document.fonts.ready.then(() => seek(Q.has('t') ? +Q.get('t') : 0));
if (Q.has('play')) { const t0 = performance.now(); const tick = () => { seek(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(tick); }; tick(); }
</script>

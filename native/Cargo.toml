[package]
name = "cahon_native"
version = "0.1.0"
edition = "2021"
description = "Fast text extraction for CAHON (xlsx, docx, pptx)"
license = "MIT"
publish = false

[lib]
name = "cahon_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
calamine = { version = "0.37", features = ["dates"] }
roxmltree = "0.21"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cfb = "0.16"

[dependencies.pyo3]
version = "0.30"
features = ["extension-module", "abi3-py310"]
optional = true

[features]
default = ["python"]
python = ["pyo3"]

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Search Anything</title>
  <script src="/static/prefs.js"></script>
  <link rel="preload" href="/static/fonts/google-sans-thai.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/google-sans-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/fonts/fonts.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Login (server mode) -->
  <section id="login" class="center hidden">
    <form id="login-form" class="panel narrow reveal">
      <h1 class="display">Search Anything</h1>
      <p class="secondary">เข้าสู่ระบบเพื่อค้นหา</p>
      <div class="input"><input type="password" id="login-password" placeholder="รหัสผ่าน" autocomplete="current-password" required></div>
      <button type="submit" class="btn primary lg block">เข้าสู่ระบบ</button>
      <p id="login-error" class="error"></p>
    </form>
  </section>

  <!-- Main app: by default only search, add and results are visible. -->
  <section id="main" class="hidden">
    <!-- optional (Settings → ตัวกรองประเภท) -->
    <nav id="filters" class="filters" aria-label="ประเภท">
      <button data-kind="" class="filter-item active"><span class="label">ทั้งหมด</span><span class="count"></span></button>
      <button data-kind="file" class="filter-item"><span class="label">ไฟล์</span><span class="count"></span></button>
      <button data-kind="note" class="filter-item"><span class="label">โน้ต</span><span class="count"></span></button>
      <button data-kind="bookmark" class="filter-item"><span class="label">ลิงก์</span><span class="count"></span></button>
      <button data-kind="password" class="filter-item"><span class="label">รหัสผ่าน</span><span class="count"></span></button>
    </nav>

    <div class="frame">
      <header class="search-row">
        <label class="input search">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="q" type="search" placeholder="ค้นหาทุกอย่าง…" autocomplete="off" spellcheck="false" aria-label="ค้นหา">
          <kbd class="hint">/</kbd>
        </label>
        <div class="add-wrap">
          <button id="add-btn" class="btn primary add" aria-haspopup="menu" aria-expanded="false" title="เพิ่ม">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span class="add-label">เพิ่ม</span>
          </button>
          <div id="add-menu" class="menu hidden" role="menu"></div>
        </div>
        <!-- optional (Settings → ปุ่มตู้รหัสผ่าน) -->
        <button id="vault-btn" class="btn ghost icon-only opt-vault" title="ตู้รหัสผ่าน"></button>
        <button id="settings-btn" class="btn ghost icon-only" title="ตั้งค่า" aria-label="ตั้งค่า">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
        </button>
        <input type="file" id="upload-input" multiple hidden>
      </header>

      <div class="body">
        <section class="list-col">
          <div class="col-head"><span id="result-title"></span><span id="result-count" class="secondary"></span></div>
          <ul id="results"></ul>
        </section>
        <!-- details: a drawer that opens on click, or a side column (Settings → รายละเอียด) -->
        <aside id="detail" aria-label="รายละเอียด"></aside>
      </div>
    </div>

    <!-- optional (Settings → แถบสถานะ) -->
    <footer class="secondary">
      <span><kbd>/</kbd> ค้นหา · <kbd>↑</kbd><kbd>↓</kbd> เลือก · <kbd>Enter</kbd> เปิด · <kbd>Shift</kbd>+<kbd>Enter</kbd> รายละเอียด · <kbd>Esc</kbd> ปิด/ล้าง</span>
      <span id="status-line"></span>
    </footer>
  </section>

  <div id="scrim" class="hidden"></div>
  <!-- Settings: categories on the left, the chosen category on the right -->
  <div id="settings" class="settings hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="settings-window">
      <nav class="settings-nav" aria-label="หมวดการตั้งค่า"></nav>
      <div class="settings-main">
        <header class="settings-head">
          <div>
            <h2 id="settings-title"></h2>
            <p id="settings-desc" class="secondary"></p>
          </div>
          <button type="button" class="btn ghost icon-only sm" id="settings-close" title="ปิด" aria-label="ปิด">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </header>
        <div class="settings-body" id="settings-body"></div>
      </div>
    </div>
  </div>

  <!-- Scan progress (Settings → การแสดงผล → แถบสถานะการสแกน) -->
  <div id="scan-pill" class="hidden" role="status">
    <button type="button" class="pill-main" id="scan-pill-open" title="ดูสถานะการสแกน">
      <span class="pill-text"></span>
      <span class="bar"><span></span></span>
    </button>
    <button type="button" class="btn ghost icon-only sm" id="scan-pill-stop" title="หยุดสแกน" aria-label="หยุดสแกน">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
    </button>
  </div>

  <dialog id="modal"><form method="dialog" id="modal-form" class="panel"></form></dialog>
  <div id="toast" class="hidden"></div>
  <div id="upload-panel" class="hidden" role="status">
    <div class="label"></div>
    <div class="bar"><span></span></div>
  </div>
  <div id="drop-zone" class="hidden" aria-hidden="true">
    <div class="drop-card">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 15V4M7.5 8.5 12 4l4.5 4.5M5 15v3a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-3"/></svg>
      <strong>วางไฟล์เพื่ออัปโหลด</strong>
      <span>ไฟล์จะถูกเก็บไว้และค้นหาได้ทันที</span>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
